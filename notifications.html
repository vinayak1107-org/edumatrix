<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications | EduMatrix</title>
  <meta name="description" content="Your EduMatrix notifications." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .icon-fill {
      font-variation-settings: 'FILL' 1;
    }
    .em-notification {
      display: flex;
      gap: 16px;
      padding: 20px;
      border-radius: var(--em-radius-lg);
      background-color: var(--em-surface-lowest);
      position: relative;
    }
    .em-notification.is-unread {
      background-color: var(--em-surface-container-high, var(--em-surface-high));
    }
    .em-notification.is-unread::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--em-primary-container);
    }
    .em-notification__icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--em-primary-container);
      color: var(--em-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>

  <main id="main-content">
    <div class="container-em" style="max-width: 760px;">

      <section id="notifGuestState" class="text-center py-5 d-none">
        <span class="material-symbols-outlined mb-3" style="font-size: 48px; color: var(--em-outline);" aria-hidden="true">lock</span>
        <h1 class="text-headline-md mb-2">Log in to see your notifications</h1>
        <a href="login.html?next=notifications.html" class="btn-em-primary">Log In</a>
      </section>

      <div id="notifContent" class="d-none">
        <section class="pt-5 pb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">

          <button type="button" class="btn-em-secondary" id="clearAllBtn">Clear All</button>
        </section>

        <section class="pb-5">
          <div class="d-flex flex-column gap-3" id="notificationsList"></div>
          <div id="notifEmptyState" class="text-center py-5 d-none">
            <span class="material-symbols-outlined mb-3" style="font-size: 48px; color: var(--em-outline);" aria-hidden="true">notifications_off</span>
