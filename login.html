<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | EduMatrix</title>
  <meta name="description" content="Log in to your EduMatrix account to continue learning." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .em-auth-shell {
      min-height: calc(100vh - 73px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block: 48px;
    }
    .em-auth-card {
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 p-2 bg-dark text-white rounded" href="#main-content">Skip to main content</a>

  <nav class="em-navbar navbar py-3" aria-label="Primary">
    <div class="container-em d-flex align-items-center justify-content-between">
      <a class="d-flex align-items-center gap-2 navbar-brand m-0" href="index.html">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5Pb0EobuatTsQMDZTx5XgjDW9uTbyJ907jWr3msBRh9Ezd9T4uKU3JIr9r1YYktzOkGW6n9Ji2fBypYG2phL3iJlDqv8UzhbnKXdcLn9ByvvvrpT13YYmp4ZDZFktNeIlXqTxso5eckpXp1oj8GmB-zbbIIyb4-tIf0RodOPqmo3jdZWuZT2cza8roe4fcHZPWK6Rs3nTW2eKBLL3PJneDhGTJzHdVKrRfPlZV-ruCqmR2xg_vOXZ"
             alt="EduMatrix logo"
             class="em-navbar__logo" />
        <span class="em-navbar__brand">EduMatrix</span>
      </a>
      <a href="signup.html" class="text-label-md" style="color: var(--em-on-surface-variant);">New here? <span style="color: var(--em-primary); font-weight: 700;">Create an account</span></a>
    </div>
  </nav>

  <main id="main-content" class="em-auth-shell">
    <div class="em-auth-card shadow-em-1 rounded-4 p-4 p-sm-5" style="border-radius: var(--em-radius-xl);">
      <h1 class="text-headline-lg mb-2">Welcome back</h1>
      <p class="text-body-md text-muted-em mb-4">Log in to continue where you left off.</p>

      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="text-label-md d-block mb-2">Email</label>
          <input type="email" class="form-control" id="loginEmail" required autocomplete="email" style="min-height: 48px; border-radius: var(--em-radius); border-color: var(--em-border);" />
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <div class="mb-2">
          <label for="loginPassword" class="text-label-md d-block mb-2">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="loginPassword" required minlength="6" autocomplete="current-password" style="min-height: 48px; border-radius: var(--em-radius) 0 0 var(--em-radius); border-color: var(--em-border);" />
            <button class="btn-em-secondary" type="button" data-toggle-password="loginPassword" aria-label="Show password" style="border-radius: 0 var(--em-radius) var(--em-radius) 0; min-height: 48px;">
              <span class="material-symbols-outlined" aria-hidden="true">visibility</span>
            </button>
          </div>
          <div class="invalid-feedback d-block" style="display: none !important;"></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" />
            <label class="form-check-label text-body-md" for="rememberMe">Remember me</label>
          </div>
          <a href="forgot-password.html" class="text-label-md" style="color: var(--em-primary);">Forgot password?</a>
        </div>

        <button type="submit" class="btn-em-primary w-100">Log In</button>
      </form>

      <p class="text-caption text-muted-em text-center mt-4 mb-0">
        This is a frontend demo. Your account only exists in this browser's storage.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
