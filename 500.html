<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something Went Wrong | EduMatrix</title>
  <meta name="description" content="An unexpected error occurred." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .em-error-shell {
      min-height: calc(100vh - 73px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-block: 48px;
    }
    .em-error-code {
      font-size: 96px;
      font-weight: 700;
      line-height: 1;
      color: var(--em-error);
    }
  </style>
</head>
<body>

  <a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 p-2 bg-dark text-white rounded" href="#main-content">Skip to main content</a>

  <nav class="em-navbar navbar py-3" aria-label="Primary">
    <div class="container-em d-flex align-items-center justify-content-between">
      <a class="d-flex align-items-center gap-2 navbar-brand m-0" href="index.html">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5Pb0EobuatTsQMDZTx5XgjDW9uTbyJ907jWr3msBRh9Ezd9T4uKU3JIr9r1YYktzOkGW6n9Ji2fBypYG2phL3iJlDqv8UzhbnKXdcLn9ByvvvrpT13YYmp4ZDZFktNeIlXqTxso5eckpXp1oj8GmB-zbbIIyb4-tIf0RodOPqmo3jdZWuZT2cza8roe4fcHZPWK6Rs3nTW2eKBLL3PJneDhGTJzHdVKrRfPlZV-ruCqmR2xg_vOXZ"
             alt="EduMatrix logo"
             class="em-navbar__logo" />
        <span class="em-navbar__brand">EduMatrix</span>
      </a>
    </div>
  </nav>

  <main id="main-content" class="em-error-shell">
    <div class="container-em" style="max-width: 32rem;">
      <p class="em-error-code mb-3">500</p>
      <h1 class="text-headline-lg mb-3">Something went wrong on our end</h1>
      <p class="text-body-lg text-muted-em mb-4">
        This isn't something you did — an unexpected error interrupted the page. Try refreshing, or head back home.
      </p>

      <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
        <button type="button" class="btn-em-primary" onclick="window.location.reload()">Try Again</button>
        <a href="index.html" class="btn-em-secondary">Back to Home</a>
      </div>

      <p class="text-caption text-muted-em mt-5 mb-0">
        If this keeps happening, <a href="#" style="color: var(--em-primary);">contact support</a>.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
