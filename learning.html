<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Learning | EduMatrix</title>
  <meta name="description" content="Continue your course on EduMatrix." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .icon-fill {
      font-variation-settings: 'FILL' 1;
    }
    .em-progress-track {
      height: 6px;
      border-radius: var(--em-radius-full);
      background-color: var(--em-outline-variant);
      overflow: hidden;
    }
    .em-progress-fill {
      height: 100%;
      background-color: var(--em-primary-container);
      border-radius: var(--em-radius-full);
      transition: width 400ms var(--em-ease);
    }
    .em-video-placeholder {
      aspect-ratio: 16 / 9;
      background-color: var(--em-deep-black);
      border-radius: var(--em-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--em-inverse-on-surface);
      position: relative;
      overflow: hidden;
    }
    .em-video-placeholder img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
    }
    .em-video-placeholder__play {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background-color: var(--em-primary-container);
      color: var(--em-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .em-lesson-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: var(--em-radius);
      cursor: pointer;
      font-size: var(--em-fs-body-md);
    }
    .em-lesson-item:hover {
      background-color: var(--em-surface-container-high, var(--em-surface-high));
    }
    .em-lesson-item.is-active {
      background-color: var(--em-primary-container);
      color: var(--em-on-primary-container);
    }
    .em-lesson-item.is-complete .em-lesson-item__check {
      color: var(--em-primary);
    }
  </style>
</head>
<body>

  <a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 p-2 bg-dark text-white rounded" href="#main-content">Skip to main content</a>

  <!-- Minimal nav — the player keeps focus on the lesson -->
  <nav class="em-navbar navbar py-3" aria-label="Primary">
    <div class="container-em d-flex align-items-center justify-content-between">
      <a class="d-flex align-items-center gap-2 navbar-brand m-0" href="index.html">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5Pb0EobuatTsQMDZTx5XgjDW9uTbyJ907jWr3msBRh9Ezd9T4uKU3JIr9r1YYktzOkGW6n9Ji2fBypYG2phL3iJlDqv8UzhbnKXdcLn9ByvvvrpT13YYmp4ZDZFktNeIlXqTxso5eckpXp1oj8GmB-zbbIIyb4-tIf0RodOPqmo3jdZWuZT2cza8roe4fcHZPWK6Rs3nTW2eKBLL3PJneDhGTJzHdVKrRfPlZV-ruCqmR2xg_vOXZ"
             alt="EduMatrix logo"
             class="em-navbar__logo" />
        <span class="em-navbar__brand">EduMatrix</span>
      </a>
      <a href="my-courses.html" class="text-label-md d-flex align-items-center gap-2" style="color: var(--em-on-surface-variant);">
        <span class="material-symbols-outlined" style="font-size: 18px;" aria-hidden="true">arrow_back</span>
        Back to My Courses
      </a>
    </div>
  </nav>

  <main id="main-content">
    <div class="container-em">

      <div id="notFoundState" class="text-center py-5 d-none">
        <h1 class="text-headline-md mb-2">Course not found</h1>
        <a href="my-courses.html" class="btn-em-primary">Back to My Courses</a>
      </div>

      <div id="learningContent" class="d-none py-4">
        <div class="row g-4">

          <!-- Main: video + lesson info -->
          <div class="col-12 col-lg-8">
            <div class="em-video-placeholder mb-4">
              <img id="lessonBackgroundImage" src="" alt="" />
              <div class="em-video-placeholder__play">
                <span class="material-symbols-outlined icon-fill" style="font-size: 36px;" aria-hidden="true">play_arrow</span>
              </div>
            </div>

            <p class="text-caption text-muted-em mb-1" id="courseTitleLabel">Course</p>
            <h1 class="text-headline-md mb-3" id="lessonTitle">Lesson title</h1>
            <p class="text-body-md text-muted-em mb-4" id="lessonDescription">Lesson description.</p>

            <div class="d-flex justify-content-between gap-3 mb-5">
              <button type="button" id="prevLessonBtn" class="btn-em-secondary">Previous Lesson</button>
              <button type="button" id="markCompleteBtn" class="btn-em-primary">Mark Lesson Complete</button>
              <button type="button" id="nextLessonBtn" class="btn-em-secondary">Next Lesson</button>
            </div>

            <!-- Resources -->
            <div class="shadow-em-1 rounded-4 p-4" style="border-radius: var(--em-radius-lg);">
              <h2 class="text-headline-md mb-3" style="font-size: 16px;">Resources</h2>
              <ul class="list-unstyled d-flex flex-column gap-2 m-0">
                <li class="d-flex align-items-center gap-2 text-body-md">
                  <span class="material-symbols-outlined" style="font-size: 18px; color: var(--em-primary);" aria-hidden="true">description</span>
                  Lesson notes (PDF)
                </li>
                <li class="d-flex align-items-center gap-2 text-body-md">
                  <span class="material-symbols-outlined" style="font-size: 18px; color: var(--em-primary);" aria-hidden="true">code</span>
                  Starter files
                </li>
              </ul>
            </div>
          </div>

          <!-- Sidebar: curriculum -->
          <div class="col-12 col-lg-4">
            <div class="shadow-em-1 rounded-4 p-4" style="border-radius: var(--em-radius-xl); position: sticky; top: 96px;">
              <div class="mb-3">
                <div class="d-flex justify-content-between mb-2">
                  <span class="text-label-md">Course Progress</span>
                  <span class="text-label-md" id="sidebarProgressText">0%</span>
                </div>
                <div class="em-progress-track"><div class="em-progress-fill" id="sidebarProgressFill" style="width: 0%;"></div></div>
              </div>
              <hr style="border-color: var(--em-outline-variant);" />
              <div id="lessonList" class="d-flex flex-column gap-1 mt-3" style="max-height: 480px; overflow-y: auto;"></div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/courses-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/learning.js"></script>
</body>
</html>
